<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet — Device Monitor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --online: #22c55e;
      --online-bg: rgba(34, 197, 94, 0.15);
      --offline: #64748b;
      --offline-bg: rgba(100, 116, 139, 0.2);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --card-border: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --online: #16a34a;
        --online-bg: rgba(22, 163, 74, 0.12);
        --offline: #94a3b8;
        --offline-bg: rgba(148, 163, 184, 0.18);
        --danger: #dc2626;
        --danger-bg: rgba(220, 38, 38, 0.12);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--online);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0.875rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }
    .btn-secondary:hover { background: var(--card-border); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1.25rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
    }

    .stat-online { color: var(--online); }
    .stat-offline { color: var(--offline); }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .panel-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .filter-btn.active {
      background: var(--card-border);
      color: var(--text-main);
      font-weight: 600;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      padding: 0.85rem 1.25rem;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--card-border);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.025em;
    }

    .badge-online {
      background: var(--online-bg);
      color: var(--online);
    }

    .badge-offline {
      background: var(--offline-bg);
      color: var(--offline);
    }

    .metric-bar-container {
      width: 100px;
      background: var(--card-border);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .metric-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 3px;
    }

    .registration-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.75rem;
      padding: 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 2rem;
      align-items: end;
    }

    @media (max-width: 640px) {
      .registration-form {
        grid-template-columns: 1fr;
      }
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 0.55rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.875rem;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }

    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">F</div>
        <div>
          <h1>Fleet Monitor</h1>
        </div>
      </div>
      <div class="header-controls">
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span id="refresh-status">Live (3s)</span>
        </div>
        <button id="btn-manual-refresh" class="btn-secondary" title="Refresh now">Refresh</button>
      </div>
    </header>

    <!-- Fleet Health Summary Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Devices</div>
        <div id="stat-total" class="stat-value">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Online (≤ 30s)</div>
        <div id="stat-online" class="stat-value stat-online">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Offline (> 30s)</div>
        <div id="stat-offline" class="stat-value stat-offline">0</div>
      </div>
    </div>

    <!-- Quick Device Registration -->
    <form id="register-form" class="registration-form">
      <div class="form-group">
        <label for="reg-id">Device ID</label>
        <input id="reg-id" class="form-control" type="text" placeholder="e.g. device-06" required />
      </div>
      <div class="form-group">
        <label for="reg-name">Device Name</label>
        <input id="reg-name" class="form-control" type="text" placeholder="e.g. Lab Temperature Sensor" required />
      </div>
      <button type="submit" class="btn-primary">Register Device</button>
    </form>

    <!-- Devices List Panel -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Monitored Devices</h2>
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="online">Online</button>
          <button class="filter-btn" data-filter="offline">Offline</button>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Status</th>
              <th>Last Heartbeat</th>
              <th>Telemetry</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="devices-tbody">
            <tr>
              <td colspan="6" class="empty-state">Loading fleet devices...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let currentFilter = 'all';
    let pollInterval = null;

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' toast-error' : '');
      setTimeout(() => {
        toast.className = 'toast';
      }, 3000);
    }

    function timeAgo(dateString) {
      if (!dateString) return 'Never';
      const now = new Date();
      const past = new Date(dateString);
      const diffSecs = Math.max(0, Math.floor((now - past) / 1000));
      if (diffSecs < 5) return 'just now';
      if (diffSecs < 60) return `${diffSecs}s ago`;
      const diffMins = Math.floor(diffSecs / 60);
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHours = Math.floor(diffMins / 60);
      return `${diffHours}h ago`;
    }

    async function fetchSummary() {
      try {
        const res = await fetch('/summary');
        if (!res.ok) throw new Error('Failed to load summary');
        const data = await res.json();
        document.getElementById('stat-total').textContent = data.total;
        document.getElementById('stat-online').textContent = data.online;
        document.getElementById('stat-offline').textContent = data.offline;
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchDevices() {
      try {
        let url = '/devices';
        if (currentFilter !== 'all') {
          url += `?status=${currentFilter}`;
        }
        const res = await fetch(url);
        if (!res.ok) throw new Error('Failed to fetch devices');
        const devices = await res.json();

        // Also fetch detail for any devices with metrics or fetch individually if needed
        renderTable(devices);
      } catch (err) {
        console.error(err);
        showToast('Error refreshing devices', true);
      }
    }

    async function sendHeartbeat(id) {
      try {
        const res = await fetch(`/devices/${encodeURIComponent(id)}/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status: 'OK',
            cpu_usage: Math.round((Math.random() * 50 + 20) * 10) / 10,
            signal_strength: Math.round(Math.random() * -30 - 50)
          })
        });
        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'Heartbeat failed');
        }
        showToast(`Heartbeat sent to ${id}`);
        refreshAll();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function renderTable(devices) {
      const tbody = document.getElementById('devices-tbody');
      if (!devices || devices.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No ${currentFilter === 'all' ? '' : currentFilter} devices registered.</td></tr>`;
        return;
      }

      tbody.innerHTML = devices.map(d => {
        const isOnline = d.status === 'ONLINE';
        const badgeClass = isOnline ? 'badge-online' : 'badge-offline';
        const heartbeatText = timeAgo(d.last_heartbeat);

        return `
          <tr>
            <td><strong><code>${escapeHtml(d.id)}</code></strong></td>
            <td>${escapeHtml(d.name)}</td>
            <td>
              <span class="badge ${badgeClass}">
                <span class="pulse-dot" style="${isOnline ? '' : 'background-color: var(--offline); animation: none;'}"></span>
                ${d.status}
              </span>
            </td>
            <td title="${d.last_heartbeat || 'No heartbeat yet'}">${heartbeatText}</td>
            <td id="metrics-${escapeHtml(d.id)}">
              <span style="color: var(--text-muted); font-size: 0.8rem;">—</span>
            </td>
            <td>
              <button class="btn-secondary" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="sendHeartbeat('${escapeHtml(d.id)}')">
                Send Heartbeat
              </button>
            </td>
          </tr>
        `;
      }).join('');

      // Fetch individual telemetry for each device to show metrics
      devices.forEach(d => {
        fetch(`/devices/${encodeURIComponent(d.id)}`)
          .then(r => r.json())
          .then(detail => {
            const cell = document.getElementById(`metrics-${d.id}`);
            if (cell && detail.last_metrics) {
              const cpu = detail.last_metrics.cpu_usage;
              const sig = detail.last_metrics.signal_strength;
              let html = '';
              if (cpu !== undefined && cpu !== null) {
                html += `<div>CPU: <strong>${cpu.toFixed(1)}%</strong></div>
                         <div class="metric-bar-container"><div class="metric-bar" style="width: ${Math.min(100, Math.max(0, cpu))}%"></div></div>`;
              }
              if (sig !== undefined && sig !== null) {
                html += `<div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Signal: ${sig} dBm</div>`;
              }
              cell.innerHTML = html;
            }
          })
          .catch(() => {});
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function refreshAll() {
      fetchSummary();
      fetchDevices();
    }

    // Filter controls
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        fetchDevices();
      });
    });

    // Manual refresh
    document.getElementById('btn-manual-refresh').addEventListener('click', refreshAll);

    // Registration form submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const idInput = document.getElementById('reg-id');
      const nameInput = document.getElementById('reg-name');

      const id = idInput.value.trim();
      const name = nameInput.value.trim();
      if (!id || !name) return;

      try {
        const res = await fetch('/devices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name })
        });

        if (res.status === 201) {
          showToast(`Device ${id} successfully registered!`);
          idInput.value = '';
          nameInput.value = '';
          refreshAll();
        } else if (res.status === 409) {
          showToast(`Device ${id} already exists`, true);
        } else {
          const errData = await res.json();
          showToast(errData.error || 'Failed to register', true);
        }
      } catch (err) {
        showToast('Connection error registering device', true);
      }
    });

    // Start auto-refresh every 3s
    refreshAll();
    pollInterval = setInterval(refreshAll, 3000);
  </script>
</body>
</html>
