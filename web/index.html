<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet</title>
  <script>
    (function() {
      const stored = localStorage.getItem('fleet-theme');
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    })();
  </script>
  <style>
    @font-face {
      font-family: 'IBM Plex Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/ibm-plex-sans-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Sans';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/ibm-plex-sans-600.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/ibm-plex-mono-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('/fonts/ibm-plex-mono-500.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/ibm-plex-mono-600.woff2') format('woff2');
    }

    :root, [data-theme="dark"] {
      --bg: #11161D;
      --surface: #171F29;
      --border: #2A3542;
      --text: #EAEEF3;
      --text-muted: #8C98A6;
      --accent: #F2A93B;
      --accent-contrast: #11161D;
      --online: #34C77B;
      --offline: #6B7684;
      --danger: #D64545;

      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'IBM Plex Mono', "SF Mono", "Cascadia Code", Menlo, monospace;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #F6F7F9;
        --surface: #FFFFFF;
        --border: #E2E6EA;
        --text: #131A22;
        --text-muted: #5B6672;
        --accent: #C97A0A;
        --accent-contrast: #FFFFFF;
        --online: #1E9E5A;
        --offline: #8892A0;
        --danger: #C1402F;
        color-scheme: light;
      }
    }

    [data-theme="light"] {
      --bg: #F6F7F9;
      --surface: #FFFFFF;
      --border: #E2E6EA;
      --text: #131A22;
      --text-muted: #5B6672;
      --accent: #C97A0A;
      --accent-contrast: #FFFFFF;
      --online: #1E9E5A;
      --offline: #8892A0;
      --danger: #C1402F;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      box-shadow: none !important;
    }

    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .panel-wrap {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }

    /* 1. Header (56px, flush hairline bottom) */
    header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 18px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sparkline-container {
      display: flex;
      align-items: center;
      height: 24px;
    }

    .sparkline-svg {
      width: 110px;
      height: 20px;
      overflow: visible;
    }

    .sparkline-path {
      stroke: var(--accent);
      stroke-width: 1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .live-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      animation: livePulse 2s infinite ease-in-out;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn-ghost-refresh {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color 0.15s ease;
    }
    .btn-ghost-refresh:hover {
      color: var(--text);
    }

    /* 2. KPI Instrument Strip */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .kpi-segment {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .kpi-segment:not(:last-child) {
      border-right: 1px solid var(--border);
    }

    .kpi-value {
      font-family: var(--font-mono);
      font-size: 28px;
      line-height: 32px;
      font-weight: 600;
    }

    .kpi-val-total { color: var(--text); }
    .kpi-val-online { color: var(--online); }
    .kpi-val-offline { color: var(--offline); }

    .kpi-label {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
    }

    /* 3. Toolbar Row (Filters + Registration) */
    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .filter-tab {
      background: transparent;
      border: none;
      padding: 6px 0;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 18px;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease;
    }

    .filter-tab:hover {
      color: var(--text);
    }

    .filter-tab.active {
      color: var(--text);
      font-weight: 600;
    }

    .filter-tab.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -13px;
      height: 2px;
      background: var(--accent);
    }

    .reg-form {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-compact {
      height: 30px;
      padding: 0 10px;
      font-family: var(--font-sans);
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
    }

    .input-compact::placeholder {
      color: var(--text-muted);
    }

    .btn-primary {
      height: 30px;
      padding: 0 12px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    /* 4. Device Table */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      font-size: 14px;
      line-height: 20px;
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .td-id {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .td-name {
      font-size: 14px;
      color: var(--text);
    }

    .status-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      line-height: 18px;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot-online {
      background-color: var(--online);
      animation: livePulse 2s infinite ease-in-out;
    }

    .status-dot-offline {
      background-color: var(--offline);
    }

    .status-text-online { color: var(--text); }
    .status-text-offline { color: var(--text-muted); }

    .td-mono {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .telemetry-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .sparkbar {
      width: 36px;
      height: 2px;
      background: var(--border);
      position: relative;
      display: inline-block;
      vertical-align: middle;
    }

    .sparkbar-fill {
      height: 100%;
      background: var(--text-muted);
      display: block;
    }

    .signal-glyph {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
      vertical-align: middle;
      margin-left: 6px;
    }

    .signal-bar {
      width: 2px;
      border-radius: 1px;
      background: var(--border);
    }
    .signal-bar.active {
      background: var(--text-muted);
    }

    .btn-ghost-action {
      background: transparent;
      border: none;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      text-decoration: none;
    }

    .btn-ghost-action:hover {
      color: var(--text);
      text-decoration: underline;
    }

    .empty-state {
      padding: 48px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* 5. Toast (bottom-left, flat single-line, 3px left border) */
    .toast-tray {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      pointer-events: none;
    }

    .toast-strip {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 2px;
      padding: 8px 16px;
      font-size: 13px;
      line-height: 18px;
      color: var(--text);
      max-width: 500px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 150ms ease, transform 150ms ease;
      pointer-events: auto;
    }

    .toast-strip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-strip.toast-danger {
      border-left-color: var(--danger);
    }

    /* Accessibility / reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .live-dot, .status-dot-online {
        animation: none !important;
        opacity: 1 !important;
      }
      .toast-strip {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="panel-wrap">
    <!-- Header (56px) -->
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M1 9h3l2.5-6 3.5 12 3-8 2 4h2"/>
          </svg>
        </span>
        <h1 class="brand-title">Fleet</h1>
      </div>

      <div class="header-right">
        <div class="sparkline-container" title="Recent fleet heartbeat activity">
          <svg class="sparkline-svg" viewBox="0 0 110 20">
            <path id="sparkline-path" class="sparkline-path" d="M0,10 L110,10" />
          </svg>
        </div>
        <div class="live-meta">
          <span class="live-dot" aria-hidden="true"></span>
          <span>Live · 3s</span>
        </div>
        <button id="btn-theme-toggle" class="btn-ghost-refresh" title="Switch theme" aria-label="Switch theme">
          <svg id="theme-icon-sun" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="3"/>
            <path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>
          </svg>
          <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none;">
            <path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/>
          </svg>
        </button>
        <button id="btn-refresh" class="btn-ghost-refresh" title="Refresh now" aria-label="Refresh now">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M13.5 8A5.5 5.5 0 1 1 9.5 2.8L11 4.5M11 1.5v3.5H7.5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- KPI Instrument Strip -->
    <div class="kpi-strip">
      <div class="kpi-segment">
        <div id="kpi-total" class="kpi-value kpi-val-total">0</div>
        <div class="kpi-label">Total devices</div>
      </div>
      <div class="kpi-segment">
        <div id="kpi-online" class="kpi-value kpi-val-online">0</div>
        <div class="kpi-label">Online</div>
      </div>
      <div class="kpi-segment">
        <div id="kpi-offline" class="kpi-value kpi-val-offline">0</div>
        <div class="kpi-label">Offline</div>
      </div>
    </div>

    <!-- Toolbar Row (Filters + Registration) -->
    <div class="toolbar-row">
      <div class="filter-tabs" role="tablist">
        <button class="filter-tab active" data-filter="all" role="tab">All</button>
        <button class="filter-tab" data-filter="online" role="tab">Online</button>
        <button class="filter-tab" data-filter="offline" role="tab">Offline</button>
      </div>

      <form id="reg-form" class="reg-form">
        <input id="reg-id" class="input-compact" type="text" placeholder="Device ID" required autocomplete="off" />
        <input id="reg-name" class="input-compact" type="text" placeholder="Device Name" required autocomplete="off" />
        <button type="submit" class="btn-primary">+ Register</button>
      </form>
    </div>

    <!-- Device Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Last beat</th>
            <th>CPU</th>
            <th>Signal</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="devices-tbody">
          <tr>
            <td colspan="7" class="empty-state">Loading fleet telemetry...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Toast Strip (Bottom-left) -->
  <div class="toast-tray">
    <div id="toast" class="toast-strip" role="status" aria-live="polite"></div>
  </div>

  <script>
    let currentFilter = 'all';
    let toastTimer = null;
    const sparklineHistory = [2, 3, 2, 4, 3, 5, 4, 4, 6, 5, 5, 7, 6, 8, 7, 8, 9, 8, 8, 9];

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast-strip visible' + (isError ? ' toast-danger' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.className = 'toast-strip' + (isError ? ' toast-danger' : '');
      }, 4000);
    }

    function timeAgo(dateString) {
      if (!dateString) return 'Never';
      const now = new Date();
      const past = new Date(dateString);
      const diffSecs = Math.max(0, Math.floor((now - past) / 1000));
      if (diffSecs < 5) return 'just now';
      if (diffSecs < 60) return `${diffSecs}s ago`;
      const diffMins = Math.floor(diffSecs / 60);
      if (diffMins < 60) return `${diffMins}m ago`;
      const diffHours = Math.floor(diffMins / 60);
      return `${diffHours}h ago`;
    }

    function updateSparkline(activityLevel) {
      sparklineHistory.shift();
      sparklineHistory.push(Math.max(1, Math.min(10, activityLevel)));

      const width = 110;
      const height = 20;
      const step = width / (sparklineHistory.length - 1);
      const maxVal = Math.max(...sparklineHistory, 10);

      const points = sparklineHistory.map((val, idx) => {
        const x = (idx * step).toFixed(1);
        const y = (height - (val / maxVal) * (height - 4) - 2).toFixed(1);
        return `${x},${y}`;
      });

      const pathElem = document.getElementById('sparkline-path');
      if (pathElem) {
        pathElem.setAttribute('d', 'M' + points.join(' L'));
      }
    }

    function renderSignalBars(dbm) {
      if (dbm === null || dbm === undefined) {
        return '<span class="td-mono">—</span>';
      }
      // dBm is negative: -50 dBm is great, -85 dBm is poor
      const activeCount = dbm > -60 ? 4 : dbm > -70 ? 3 : dbm > -80 ? 2 : 1;
      const heights = [3, 6, 9, 12];
      const barsHtml = heights.map((h, i) => `
        <span class="signal-bar ${i < activeCount ? 'active' : ''}" style="height:${h}px;"></span>
      `).join('');

      return `
        <div class="telemetry-cell">
          <span>${dbm} dBm</span>
          <span class="signal-glyph" aria-hidden="true">${barsHtml}</span>
        </div>
      `;
    }

    function renderCpuSparkbar(cpu) {
      if (cpu === null || cpu === undefined) {
        return '<span class="td-mono">—</span>';
      }
      const pct = Math.min(100, Math.max(0, cpu));
      return `
        <div class="telemetry-cell">
          <span>${cpu.toFixed(1)}%</span>
          <span class="sparkbar" aria-hidden="true">
            <span class="sparkbar-fill" style="width: ${pct}%;"></span>
          </span>
        </div>
      `;
    }

    async function fetchSummary() {
      try {
        const res = await fetch('/summary');
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById('kpi-total').textContent = data.total;
        document.getElementById('kpi-online').textContent = data.online;
        document.getElementById('kpi-offline').textContent = data.offline;

        // Sparkline tracks active online devices + variance
        updateSparkline(data.online * 1.5 + (Math.random() * 2));
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchDevices() {
      try {
        let url = '/devices';
        if (currentFilter !== 'all') {
          url += `?status=${currentFilter}`;
        }
        const res = await fetch(url);
        if (!res.ok) throw new Error('Failed to fetch devices');
        const devices = await res.json();
        renderTable(devices);
      } catch (err) {
        console.error(err);
      }
    }

    async function sendHeartbeat(id) {
      try {
        const cpu = Math.round((Math.random() * 50 + 20) * 10) / 10;
        const sig = Math.round(Math.random() * -30 - 50);

        const res = await fetch(`/devices/${encodeURIComponent(id)}/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            status: 'OK',
            cpu_usage: cpu,
            signal_strength: sig
          })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error || 'Heartbeat failed');
        }

        showToast(`Heartbeat recorded for ${id}`);
        refreshAll();
      } catch (err) {
        showToast(err.message, true);
      }
    }

    function renderTable(devices) {
      const tbody = document.getElementById('devices-tbody');
      if (!devices || devices.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No devices registered yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = devices.map(d => {
        const isOnline = d.status === 'ONLINE';
        const statusDotClass = isOnline ? 'status-dot-online' : 'status-dot-offline';
        const statusTextClass = isOnline ? 'status-text-online' : 'status-text-offline';
        const statusLabel = isOnline ? 'Online' : 'Offline';
        const heartbeatText = timeAgo(d.last_heartbeat);

        return `
          <tr>
            <td class="td-id">${escapeHtml(d.id)}</td>
            <td class="td-name">${escapeHtml(d.name)}</td>
            <td>
              <div class="status-cell">
                <span class="status-dot ${statusDotClass}" aria-hidden="true"></span>
                <span class="${statusTextClass}">${statusLabel}</span>
              </div>
            </td>
            <td class="td-mono" title="${d.last_heartbeat || 'No heartbeat recorded'}">${heartbeatText}</td>
            <td id="cpu-${escapeHtml(d.id)}"><span class="td-mono">—</span></td>
            <td id="sig-${escapeHtml(d.id)}"><span class="td-mono">—</span></td>
            <td>
              <button class="btn-ghost-action" onclick="sendHeartbeat('${escapeHtml(d.id)}')">
                Send heartbeat
              </button>
            </td>
          </tr>
        `;
      }).join('');

      // Fetch telemetry for each device
      devices.forEach(d => {
        fetch(`/devices/${encodeURIComponent(d.id)}`)
          .then(r => r.json())
          .then(detail => {
            const cpuCell = document.getElementById(`cpu-${d.id}`);
            const sigCell = document.getElementById(`sig-${d.id}`);
            if (detail.last_metrics) {
              if (cpuCell) cpuCell.innerHTML = renderCpuSparkbar(detail.last_metrics.cpu_usage);
              if (sigCell) sigCell.innerHTML = renderSignalBars(detail.last_metrics.signal_strength);
            }
          })
          .catch(() => {});
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function refreshAll() {
      fetchSummary();
      fetchDevices();
    }

    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        fetchDevices();
      });
    });

    // Refresh button
    document.getElementById('btn-refresh').addEventListener('click', refreshAll);

    // Registration form
    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const idInput = document.getElementById('reg-id');
      const nameInput = document.getElementById('reg-name');
      const id = idInput.value.trim();
      const name = nameInput.value.trim();
      if (!id || !name) return;

      try {
        const res = await fetch('/devices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name })
        });

        if (res.status === 201) {
          showToast(`Device ${id} registered`);
          idInput.value = '';
          nameInput.value = '';
          refreshAll();
        } else if (res.status === 409) {
          showToast(`Device ${id} already exists`, true);
        } else {
          const errData = await res.json();
          showToast(errData.error || 'Failed to register', true);
        }
      } catch (err) {
        showToast('Connection error registering device', true);
      }
    });

    // Theme toggle handling
    function getEffectiveTheme() {
      const explicit = document.documentElement.getAttribute('data-theme');
      if (explicit === 'light' || explicit === 'dark') return explicit;
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }

    function updateThemeIcon() {
      const theme = getEffectiveTheme();
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      const btn = document.getElementById('btn-theme-toggle');
      if (theme === 'dark') {
        if (sun) sun.style.display = 'block';
        if (moon) moon.style.display = 'none';
        if (btn) btn.title = 'Switch to light mode';
      } else {
        if (sun) sun.style.display = 'none';
        if (moon) moon.style.display = 'block';
        if (btn) btn.title = 'Switch to dark mode';
      }
    }

    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      const current = getEffectiveTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fleet-theme', next);
      updateThemeIcon();
    });

    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (!localStorage.getItem('fleet-theme')) {
        updateThemeIcon();
      }
    });

    updateThemeIcon();

    // Initial load + 3s polling
    refreshAll();
    setInterval(refreshAll, 3000);
  </script>
</body>
</html>
