services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-server
    ports:
      - "8080:8080"
    environment:
      - FLEET_ADDR=:8080
      - FLEET_DB_PATH=/data/fleet.db
      - FLEET_ONLINE_WINDOW=30s
    volumes:
      - fleet-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/summary || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: fleet-simulator
    depends_on:
      server:
        condition: service_healthy
    command: ["-url=http://server:8080", "-n=5", "-interval=5s"]
    restart: unless-stopped

volumes:
  fleet-data:
    driver: local
